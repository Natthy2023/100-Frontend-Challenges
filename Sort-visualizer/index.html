<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorting Visualizer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css"/>
<style>
:root{--bg-dark:#0f172a;--panel-dark:#0b1220;--text-dark:#e2e8f0;--muted-dark:#94a3b8;--accent:#8b5cf6;--glow:#22c55e;}
:root{--bg-light:#f8fafc;--panel-light:#ffffff;--text-light:#0f172a;--muted-light:#475569;--glow:#16a34a;}
body.dark{--bg:var(--bg-dark);--panel:var(--panel-dark);--text:var(--text-dark);--muted:var(--muted-dark);--glow:#22c55e;}
body.light{--bg:var(--bg-light);--panel:var(--panel-light);--text:var(--text-light);--muted:var(--muted-light);--glow:#16a34a;}
body{margin:0;font-family:Inter,sans-serif;background:var(--bg);color:var(--text);transition:all 0.3s;display:flex;flex-direction:column;align-items:center;padding:12px;}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;}
select,input,button{padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,.06);background:transparent;color:var(--text);transition:all 0.3s;}
button{cursor:pointer;background:linear-gradient(90deg,var(--accent),#7c3aed);border:none;transition:all 0.3s;}
button:hover{transform:scale(1.05);}
#canvasWrap{width:100%;max-width:1000px;height:400px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.04));border-radius:8px;display:flex;align-items:flex-end;justify-content:center;}
canvas{width:100%;height:100%;}
#codeArea{width:100%;max-width:1000px;height:250px;overflow:auto;background:var(--panel);padding:12px;border-radius:8px;font-family:monospace;white-space:pre;}
#userInput{width:300px;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:var(--panel);color:var(--text);}
</style>
</head>
<body class="dark">

<div class="controls">
<input type="text" id="userInput" placeholder="Enter numbers e.g. 5,3,8,1">
<select id="sortAlgo">
<option value="bubble">Bubble Sort</option>
<option value="selection">Selection Sort</option>
<option value="insertion">Insertion Sort</option>
<option value="merge">Merge Sort</option>
<option value="quick">Quick Sort</option>
<option value="heap">Heap Sort</option>
</select>
<select id="langSelect"><option value="js">JavaScript</option><option value="cpp">C++</option><option value="python">Python</option></select>
<input type="range" id="speedRange" min="50" max="1000" step="50" value="200">
<span id="speedLabel">Speed: Normal</span>
<button id="runBtn">Run</button>
<button id="newBtn">New Array</button>
<button id="resetBtn">Reset</button>
<button id="modeBtn">Toggle Mode</button>
</div>

<div id="canvasWrap"><canvas id="sortCanvas"></canvas></div>
<div id="codeArea"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script>
const canvas=document.getElementById('sortCanvas'),ctx=canvas.getContext('2d');
let mode='dark',animationSpeed=200,data=[];
const sortAlgo=document.getElementById('sortAlgo'),langSelect=document.getElementById('langSelect');
const codeArea=document.getElementById('codeArea'),speedRange=document.getElementById('speedRange');
const speedLabel=document.getElementById('speedLabel');
const userInput=document.getElementById('userInput');

function resizeCanvas(){canvas.width=canvas.parentElement.clientWidth;canvas.height=canvas.parentElement.clientHeight;drawArray();}
window.addEventListener('resize',resizeCanvas);
resizeCanvas();

function parseInput(){ 
  let vals=userInput.value.split(/[, ]+/).map(Number).filter(n=>!isNaN(n));
  if(vals.length>0) data=vals; else randArray(); 
}
function randArray(n=15){data=[];for(let i=0;i<n;i++)data.push(Math.floor(Math.random()*50)+1);}
function drawArray(highlight=-1){ctx.clearRect(0,0,canvas.width,canvas.height);const w=canvas.width/data.length-10;for(let i=0;i<data.length;i++){ctx.fillStyle=(i===highlight)?'var(--glow)':(mode==='dark'?'#222':'#444');ctx.fillRect(i*(w+8)+20,canvas.height-20-data[i]*5,w,data[i]*5);ctx.fillStyle=mode==='dark'?'#e2e8f0':'#0f172a';ctx.fillText(data[i],i*(w+8)+20,canvas.height-25-data[i]*5);}}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

// --- Sorting Animations ---
async function animateBubble(){for(let i=0;i<data.length;i++){for(let j=0;j<data.length-i-1;j++){if(data[j]>data[j+1]) [data[j],data[j+1]]=[data[j+1],data[j]]; drawArray(j); await sleep(animationSpeed);}}}
async function animateSelection(){for(let i=0;i<data.length-1;i++){let min=i;for(let j=i+1;j<data.length;j++){if(data[j]<data[min]) min=j; drawArray(j); await sleep(animationSpeed);} [data[i],data[min]]=[data[min],data[i]]; drawArray(i); await sleep(animationSpeed);}}
async function animateInsertion(){for(let i=1;i<data.length;i++){let key=data[i],j=i-1;while(j>=0 && data[j]>key){data[j+1]=data[j]; j--; drawArray(j+1); await sleep(animationSpeed);} data[j+1]=key; drawArray(j+1); await sleep(animationSpeed);}}
async function animateMerge(){ 
  async function mergeSort(arr,l,r){
    if(l>=r) return;
    const m=Math.floor((l+r)/2);
    await mergeSort(arr,l,m); await mergeSort(arr,m+1,r);
    let temp=[],i=l,j=m+1;
    while(i<=m && j<=r){
      if(arr[i]<=arr[j]) temp.push(arr[i++]); else temp.push(arr[j++]);
      drawArray(i); await sleep(animationSpeed);
    }
    for(let k=l;k<=r;k++){arr[k]=temp[k-l]; drawArray(k); await sleep(animationSpeed);}
  }
  await mergeSort(data,0,data.length-1);
}
async function animateQuick(){
  async function quickSort(arr,l,r){
    if(l>=r) return;
    let pivot=arr[r],i=l;
    for(let j=l;j<r;j++){if(arr[j]<pivot){[arr[i],arr[j]]=[arr[j],arr[i]]; i++;} drawArray(j); await sleep(animationSpeed);}
    [arr[i],arr[r]]=[arr[r],arr[i]]; drawArray(i); await sleep(animationSpeed);
    await quickSort(arr,l,i-1); await quickSort(arr,i+1,r);
  }
  await quickSort(data,0,data.length-1);
}
async function animateHeap(){
  async function heapify(n,i){
    let largest=i,l=2*i+1,r=2*i+2;
    if(l<n && data[l]>data[largest]) largest=l;
    if(r<n && data[r]>data[largest]) largest=r;
    if(largest!==i){[data[i],data[largest]]=[data[largest],data[i]]; drawArray(i); await sleep(animationSpeed); await heapify(n,largest);}
  }
  let n=data.length;
  for(let i=Math.floor(n/2)-1;i>=0;i--) await heapify(n,i);
  for(let i=n-1;i>0;i--){[data[0],data[i]]=[data[i],data[0]]; drawArray(0); await sleep(animationSpeed); await heapify(i,0);}
}

// --- Animate selected algo ---
async function animateAlgo(){parseInput();switch(sortAlgo.value){
    case 'bubble': await animateBubble(); break;
    case 'selection': await animateSelection(); break;
    case 'insertion': await animateInsertion(); break;
    case 'merge': await animateMerge(); break;
    case 'quick': await animateQuick(); break;
    case 'heap': await animateHeap(); break;
} showCode();}

// --- Code display ---
function showCode(){
  let algo=sortAlgo.value,lang=langSelect.value,code='';
  const codes={
    bubble:{js:`function bubbleSort(arr){for(let i=0;i<arr.length;i++){for(let j=0;j<arr.length-i-1;j++){if(arr[j]>arr[j+1]){[arr[j],arr[j+1]]=[arr[j+1],arr[j]];}}}}`,
            cpp:`void bubbleSort(vector<int>& arr){for(int i=0;i<arr.size();i++){for(int j=0;j<arr.size()-i-1;j++){if(arr[j]>arr[j+1])swap(arr[j],arr[j+1]);}}}`,
            python:`def bubble_sort(arr):\n for i in range(len(arr)):\n  for j in range(len(arr)-i-1):\n   if arr[j]>arr[j+1]: arr[j],arr[j+1]=arr[j+1],arr[j]`},
    selection:{js:`function selectionSort(arr){for(let i=0;i<arr.length-1;i++){let min=i;for(let j=i+1;j<arr.length;j++){if(arr[j]<arr[min])min=j;}[arr[i],arr[min]]=[arr[min],arr[i]];}}`,
               cpp:`void selectionSort(vector<int>& arr){for(int i=0;i<arr.size()-1;i++){int min=i;for(int j=i+1;j<arr.size();j++){if(arr[j]<arr[min])min=j;}swap(arr[i],arr[min]);}}`,
               python:`def selection_sort(arr):\n for i in range(len(arr)-1):\n  min_idx=i\n  for j in range(i+1,len(arr)):\n   if arr[j]<arr[min_idx]: min_idx=j\n  arr[i],arr[min_idx]=arr[min_idx],arr[i]`},
    insertion:{js:`function insertionSort(arr){for(let i=1;i<arr.length;i++){let key=arr[i],j=i-1;while(j>=0&&arr[j]>key){arr[j+1]=arr[j];j--;}arr[j+1]=key;}}`,
               cpp:`void insertionSort(vector<int>& arr){for(int i=1;i<arr.size();i++){int key=arr[i],j=i-1;while(j>=0&&arr[j]>key){arr[j+1]=arr[j];j--;}arr[j+1]=key;}}`,
               python:`def insertion_sort(arr):\n for i in range(1,len(arr)):\n  key=arr[i]\n  j=i-1\n  while j>=0 and arr[j]>key:\n   arr[j+1]=arr[j]; j-=1\n  arr[j+1]=key`},
    merge:{js:`function mergeSort(arr){/*recursive merge sort*/}`},
    quick:{js:`function quickSort(arr){/*recursive quick sort*/}`},
    heap:{js:`function heapSort(arr){/*heap sort*/}`}
  };
  if(codes[algo]) code=codes[algo][lang]||codes[algo]['js'];
  codeArea.innerHTML=`<pre><code class="language-${lang}">${code}</code></pre>`;Prism.highlightAll();
}

// --- Event listeners ---
sortAlgo.addEventListener('change',showCode);
langSelect.addEventListener('change',showCode);
speedRange.addEventListener('input',()=>{animationSpeed=1050-speedRange.value; let val=parseInt(speedRange.value); let label='Normal'; if(val<300)label='Slow'; if(val>700)label='Fast'; if(val>900)label='Instant'; speedLabel.textContent='Speed: '+label;});
document.getElementById('modeBtn').onclick=()=>{mode=mode==='dark'?'light':'dark';document.body.className=mode; drawArray();};
document.getElementById('newBtn').onclick=()=>{randArray();drawArray();};
document.getElementById('resetBtn').onclick=()=>{data=[];drawArray();};
document.getElementById('runBtn').onclick=animateAlgo;

// --- Init ---
randArray(); drawArray(); showCode();
</script>
</body>
</html>
