<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLQ Visualizer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css"/>
<style>
:root{--bg-dark:#0f172a;--panel-dark:#0b1220;--text-dark:#e2e8f0;--muted-dark:#94a3b8;--accent:#8b5cf6;--glow:#22c55e;}
:root{--bg-light:#f8fafc;--panel-light:#ffffff;--text-light:#0f172a;--muted-light:#475569;--glow:#16a34a;}
body.dark{--bg:var(--bg-dark);--panel:var(--panel-dark);--text:var(--text-dark);--muted:var(--muted-dark);--glow:#22c55e;}
body.light{--bg:var(--bg-light);--panel:var(--panel-light);--text:var(--text-light);--muted:var(--muted-light);--glow:#16a34a;}
body{margin:0;font-family:Inter,sans-serif;background:var(--bg);color:var(--text);transition:all 0.3s;display:flex;flex-direction:column;align-items:center;padding:12px;}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;}
input,select,button{padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,.06);background:transparent;color:var(--text);transition:all 0.3s;}
button{cursor:pointer;background:linear-gradient(90deg,var(--accent),#7c3aed);border:none;transition:all 0.3s;}
button:hover{transform:scale(1.05);}
#canvasWrap{width:100%;max-width:1000px;height:400px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.04));border-radius:8px;display:flex;align-items:flex-end;justify-content:center;}
canvas{width:100%;height:100%;}
#codeArea{width:100%;max-width:1000px;height:250px;overflow:auto;background:var(--panel);padding:12px;border-radius:8px;font-family:monospace;white-space:pre;}
#userInput{width:120px;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:var(--panel);color:var(--text);}
</style>
</head>
<body class="dark">

<div class="controls">
<select id="dataStructure">
<option value="stack">Stack</option>
<option value="queue">Queue</option>
<option value="linkedlist">Linked List</option>
</select>
<input type="number" id="userInput" placeholder="Value">
<select id="langSelect"><option value="js">JavaScript</option><option value="cpp">C++</option><option value="python">Python</option></select>
<input type="range" id="speedRange" min="50" max="1000" step="50" value="200"><span id="speedLabel">Speed: Normal</span>
<button id="runBtn">Run</button>
<button id="newBtn">New</button>
<button id="resetBtn">Reset</button>
<button id="modeBtn">Toggle Mode</button>
</div>

<div id="canvasWrap"><canvas id="slqCanvas"></canvas></div>
<div id="codeArea"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script>
const canvas=document.getElementById('slqCanvas'),ctx=canvas.getContext('2d');
let mode='dark',animationSpeed=200,data=[];
const dataStructure=document.getElementById('dataStructure'),langSelect=document.getElementById('langSelect');
const codeArea=document.getElementById('codeArea'),speedRange=document.getElementById('speedRange');
const speedLabel=document.getElementById('speedLabel'),userInput=document.getElementById('userInput');

function resizeCanvas(){canvas.width=canvas.parentElement.clientWidth;canvas.height=canvas.parentElement.clientHeight;drawData();}
window.addEventListener('resize',resizeCanvas);
resizeCanvas();

function randData(n=5){data=[];for(let i=0;i<n;i++)data.push(Math.floor(Math.random()*50)+1);}
function drawData(highlight=-1){ctx.clearRect(0,0,canvas.width,canvas.height);const w=50;const gap=10;for(let i=0;i<data.length;i++){ctx.fillStyle=(i===highlight)?'var(--glow)':(mode==='dark'?'#222':'#444');ctx.fillRect(i*(w+gap)+20,canvas.height-60,w,50);ctx.fillStyle=mode==='dark'?'#e2e8f0':'#0f172a';ctx.fillText(data[i],i*(w+gap)+45,canvas.height-30);}}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

// --- Stack Animation ---
async function animateStack(value){
  data.push(value);
  for(let i=data.length-1;i>=0;i--){drawData(i); await sleep(animationSpeed);}
}

// --- Queue Animation ---
async function animateQueue(value){
  data.push(value);
  for(let i=0;i<data.length;i++){drawData(i); await sleep(animationSpeed);}
}

// --- Linked List Animation (Insert at end) ---
async function animateLinkedList(value){
  data.push(value);
  for(let i=0;i<data.length;i++){drawData(i); await sleep(animationSpeed);}
}

// --- Run Selected Algo ---
async function animateAlgo(){let val=parseInt(userInput.value); if(isNaN(val)) val=Math.floor(Math.random()*50)+1; switch(dataStructure.value){
    case 'stack': await animateStack(val); break;
    case 'queue': await animateQueue(val); break;
    case 'linkedlist': await animateLinkedList(val); break;
} showCode();}

// --- Code display ---
function showCode(){
  let ds=dataStructure.value,lang=langSelect.value,code='';
  const codes={
    stack:{js:`let stack=[];\nstack.push(${userInput.value});`,
           cpp:`stack.push(${userInput.value});`,
           python:`stack.append(${userInput.value})`},
    queue:{js:`let queue=[];\nqueue.push(${userInput.value});`,
           cpp:`queue.push(${userInput.value});`,
           python:`queue.append(${userInput.value})`},
    linkedlist:{js:`let list=[];\nlist.push(${userInput.value});`,
           cpp:`list.push_back(${userInput.value});`,
           python:`list.append(${userInput.value})`}
  };
  if(codes[ds]) code=codes[ds][lang]||codes[ds]['js'];
  codeArea.innerHTML=`<pre><code class="language-${lang}">${code}</code></pre>`;Prism.highlightAll();
}

// --- Event Listeners ---
dataStructure.addEventListener('change',showCode);
langSelect.addEventListener('change',showCode);
speedRange.addEventListener('input',()=>{animationSpeed=1050-speedRange.value; let val=parseInt(speedRange.value); let label='Normal'; if(val<300)label='Slow'; if(val>700)label='Fast'; if(val>900)label='Instant'; speedLabel.textContent='Speed: '+label;});
document.getElementById('modeBtn').onclick=()=>{mode=mode==='dark'?'light':'dark';document.body.className=mode; drawData();};
document.getElementById('newBtn').onclick=()=>{randData(); drawData();};
document.getElementById('resetBtn').onclick=()=>{data=[]; drawData();};
document.getElementById('runBtn').onclick=animateAlgo;

// --- Init ---
randData(); drawData(); showCode();
</script>
</body>
</html>
