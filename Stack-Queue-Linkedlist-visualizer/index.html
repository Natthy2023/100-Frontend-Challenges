<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stack/Queue/LinkedList Visualizer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css"/>
<style>
:root{--bg-dark:#0f172a;--panel-dark:#0b1220;--text-dark:#e2e8f0;--muted-dark:#94a3b8;--accent:#8b5cf6;--glow:#22c55e;}
:root{--bg-light:#f8fafc;--panel-light:#ffffff;--text-light:#0f172a;--muted-light:#475569;--glow:#16a34a;}
body.dark{--bg:var(--bg-dark);--panel:var(--panel-dark);--text:var(--text-dark);--muted:var(--muted-dark);--glow:#22c55e;}
body.light{--bg:var(--bg-light);--panel:var(--panel-light);--text:var(--text-light);--muted:var(--muted-light);--glow:#16a34a;}
body{margin:0;font-family:Inter,sans-serif;background:var(--bg);color:var(--text);transition:all 0.3s;display:flex;flex-direction:column;align-items:center;padding:12px;}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;}
select,input,button{padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,.06);background:transparent;color:var(--text);transition:all 0.3s;}
button{cursor:pointer;background:linear-gradient(90deg,var(--accent),#7c3aed);border:none;transition:all 0.3s;}
button:hover{transform:scale(1.05);}
#canvasWrap{width:100%;max-width:1000px;height:400px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.04));border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:auto;}
canvas{width:100%;height:100%;}
#codeArea{width:100%;max-width:1000px;height:250px;overflow:auto;background:var(--panel);padding:12px;border-radius:8px;font-family:monospace;white-space:pre;}
.hidden{display:none;}
</style>
</head>
<body class="dark">
<div class="controls">
<select id="dsSelect">
<option value="stack">Stack</option>
<option value="queue">Queue</option>
<option value="deque">Deque</option>
<option value="circularQueue">Circular Queue</option>
<option value="linkedlist">Linked List</option>
</select>
<select id="linkedType" class="hidden">
<option value="single">Singly Linked List</option>
<option value="double">Doubly Linked List</option>
</select>
<input type="text" id="inputValue" placeholder="Enter Value">
<input type="number" id="indexValue" placeholder="Enter Index" class="hidden">
<button id="pushBtn">Push/Enqueue/Insert</button>
<button id="popBtn">Pop/Dequeue/Delete</button>
<button id="resetBtn">Reset</button>
<button id="modeBtn">Toggle Mode</button>
</div>
<div id="canvasWrap"><canvas id="dsCanvas"></canvas></div>
<div id="codeArea"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script>
const canvas=document.getElementById('dsCanvas');
const ctx=canvas.getContext('2d');
let mode='dark';
let dsSelect=document.getElementById('dsSelect');
let linkedType=document.getElementById('linkedType');
let inputValue=document.getElementById('inputValue');
let indexValue=document.getElementById('indexValue');
let codeArea=document.getElementById('codeArea');
let data=[];
function resizeCanvas(){canvas.width=canvas.parentElement.clientWidth;canvas.height=canvas.parentElement.clientHeight;drawDS();}
window.addEventListener('resize',resizeCanvas);resizeCanvas();
dsSelect.addEventListener('change',()=>{linkedType.classList.toggle('hidden',dsSelect.value!=='linkedlist');indexValue.classList.toggle('hidden',dsSelect.value!=='linkedlist');data=[];drawDS();showCode();});
document.getElementById('modeBtn').onclick=()=>{mode=mode==='dark'?'light':'dark';document.body.className=mode;drawDS();};
document.getElementById('resetBtn').onclick=()=>{data=[];drawDS();showCode();};
let animationSpeed=300;
async function drawDS(highlight=-1){ctx.clearRect(0,0,canvas.width,canvas.height);const n=data.length;
ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='16px monospace';
if(dsSelect.value==='stack'){
let w=60,h=40,startX=canvas.width/2-30,startY=canvas.height-20;
for(let i=0;i<n;i++){
ctx.fillStyle=(i===highlight)?'var(--glow)':'#555';
ctx.fillRect(startX,startY-(i+1)*h,w,h);
ctx.fillStyle=mode==='dark'?'#e2e8f0':'#0f172a';
ctx.fillText(data[i],startX+w/2,startY-(i+1)*h+h/2);
}}
else if(dsSelect.value==='queue'||dsSelect.value==='deque'||dsSelect.value==='circularQueue'){
let w=60,h=40,startX=20,startY=canvas.height/2;
for(let i=0;i<n;i++){
ctx.fillStyle=(i===highlight)?'var(--glow)':'#555';
ctx.fillRect(startX+i*(w+10),startY-w/2,w,h);
ctx.fillStyle=mode==='dark'?'#e2e8f0':'#0f172a';
ctx.fillText(data[i],startX+i*(w+10)+w/2,startY);
}}
else if(dsSelect.value==='linkedlist'){
let w=60,h=40,startX=20,startY=canvas.height/2;
for(let i=0;i<n;i++){
ctx.fillStyle=(i===highlight)?'var(--glow)':'#555';
ctx.fillRect(startX+i*(w+80),startY-w/2,w,h);
ctx.fillStyle=mode==='dark'?'#e2e8f0':'#0f172a';
ctx.fillText(data[i],startX+i*(w+80)+w/2,startY);
if(i<n-1){ctx.beginPath();ctx.moveTo(startX+i*(w+80)+w,startY);ctx.lineTo(startX+(i+1)*(w+80),startY);ctx.strokeStyle='#999';ctx.stroke();}
if(linkedType.value==='double'&&i>0){ctx.beginPath();ctx.moveTo(startX+i*(w+80),startY);ctx.lineTo(startX+(i-1)*(w+80)+w,startY);ctx.strokeStyle='#999';ctx.stroke();}}}
}
async function insertNode(){let val=inputValue.value;let idx=parseInt(indexValue.value);if(val==='')return;if(dsSelect.value==='linkedlist'){if(isNaN(idx)||idx<0||idx>data.length) return;
for(let i=0;i<=idx;i++){await drawDS(i);await new Promise(r=>setTimeout(r,animationSpeed));}
data.splice(idx,0,val);await drawDS(idx);showCode();}else{data.push(val);await drawDS(data.length-1);showCode();}}
async function deleteNode(){let idx=parseInt(indexValue.value);
if(dsSelect.value==='linkedlist'){if(isNaN(idx)||idx<0||idx>=data.length) return;
await drawDS(idx);await new Promise(r=>setTimeout(r,animationSpeed));
data.splice(idx,1);await drawDS(idx);showCode();}else{if(data.length===0)return;data.pop();await drawDS(data.length);showCode();}}
document.getElementById('pushBtn').onclick=insertNode;
document.getElementById('popBtn').onclick=deleteNode;
function showCode(){let code='',ds=dsSelect.value,lang='js';
if(ds==='stack'){code=`// Stack Push\nstack.push(value);\n// Stack Pop\nstack.pop();`;}
else if(ds==='queue'){code=`// Queue Enqueue\nqueue.push(value);\n// Queue Dequeue\nqueue.shift();`;}
else if(ds==='deque'){code=`// Deque Push Front\ndeque.unshift(value);\n// Deque Push Back\ndeque.push(value);\n// Pop Front\ndeque.shift();\n// Pop Back\ndeque.pop();`;}
else if(ds==='circularQueue'){code=`// Circular Queue Implementation\ncircularQueue.enqueue(value);\ncircularQueue.dequeue();`;}
else if(ds==='linkedlist'){if(linkedType.value==='single'){code=`// Singly Linked List Insert\nlist.insert(index,value);\n// Delete\nlist.delete(index);`;}
else{code=`// Doubly Linked List Insert\nlist.insert(index,value);\n// Delete\nlist.delete(index);`;}}
codeArea.innerHTML=`<pre><code class="language-${lang}">${code}</code></pre>`;Prism.highlightAll();}
</script>
</body>
</html>
