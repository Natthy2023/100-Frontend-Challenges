<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Advanced Search Visualizer</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-color: #0f172a;
  --sidebar-bg: #1e293b;
  --text-color: #e2e8f0;
  --accent-color: #8b5cf6;
  --accent-hover: #7c3aed;
  --node-fill: #334155;
  --node-stroke: #94a3b8;
  --link-stroke: #475569;
  --visited-color: #64748b;
  --frontier-color: #3b82f6;
  --current-color: #f59e0b;
  --path-color: #22c55e;
  --goal-color: #ef4444;
  --bi-color: #ec4899;
}
.light-theme { --bg-color:#f8fafc; --sidebar-bg:#e2e8f0; --text-color:#0f172a; --node-fill:#cbd5e1; --node-stroke:#475569; --link-stroke:#94a3b8; }

*{box-sizing:border-box}
body{margin:0;font-family:'Inter',sans-serif;background-color:var(--bg-color);color:var(--text-color);display:flex;flex-direction:row;height:100vh;overflow:hidden;transition:background .25s,color .25s}

/* Sidebar */
.sidebar{width:320px;background:var(--sidebar-bg);padding:18px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;z-index:30;box-shadow:2px 0 12px rgba(0,0,0,.35);transition:transform .35s cubic-bezier(.2,.9,.2,1)}
.sidebar.hide{transform:translateX(-100%)}
.sidebar h1{margin:0;color:var(--accent-color);font-size:1.4rem}
.control-group{display:flex;flex-direction:column;gap:8px}
label{font-weight:600;color:#cbd5e1;font-size:0.9rem}
select,button,input[type=range],input[type=number]{background:var(--bg-color);border:1px solid var(--link-stroke);color:var(--text-color);padding:8px;border-radius:6px;font-family:inherit;font-size:0.9rem}
button{cursor:pointer;font-weight:600;background:var(--accent-color);border:none}
button.secondary{background:var(--node-fill)}
button:hover{background:var(--accent-hover);transform:translateY(-1px)}
.stats{background:var(--bg-color);padding:12px;border-radius:8px;font-size:0.85rem}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:0.8rem}
.dot{width:10px;height:10px;border-radius:50%}
.hidden{display:none}

/* Main */
.main-area{flex:1;position:relative;overflow:hidden;cursor:grab}
svg{width:100%;height:100%}
.node circle{fill:var(--node-fill);stroke:var(--node-stroke);stroke-width:2px;transition:fill .25s,stroke .25s}
.node text{fill:var(--text-color);font-size:12px;font-weight:600;pointer-events:none}
.node text.cost{font-size:10px;fill:#94a3b8}
.link{fill:none;stroke:var(--link-stroke);stroke-width:1.5px;transition:stroke .2s}
.node.visited circle{fill:var(--visited-color);stroke:var(--visited-color)}
.node.frontier circle{fill:var(--frontier-color);stroke:var(--frontier-color)}
.node.current circle{fill:var(--current-color);stroke:#fff}
.node.path circle{fill:var(--path-color);stroke:var(--path-color)}
.node.goal circle{fill:var(--goal-color);stroke:#fff}
.node.start circle{stroke:var(--path-color);stroke-width:3px}
.node.visited-bi circle{fill:var(--bi-color);stroke:var(--bi-color)}
.link.path{stroke:var(--path-color);stroke-width:3px}
.link.searched{stroke:var(--visited-color)}

/* Hamburger */
#hamburger{display:none;position:fixed;top:12px;left:12px;z-index:40;width:40px;height:40px;background:var(--accent-color);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer}
#hamburger div{width:22px;height:3px;background:#fff;margin:3px 0;border-radius:2px;transition:all .3s}
#hamburger.active div:nth-child(1){transform:translateY(6px) rotate(45deg)}
#hamburger.active div:nth-child(2){opacity:0}
#hamburger.active div:nth-child(3){transform:translateY(-6px) rotate(-45deg)}

/* Responsive */
@media(max-width:900px){body{flex-direction:column;height:100vh}#hamburger{display:flex}.sidebar{position:fixed;top:0;left:0;height:100vh}}
@media(max-width:600px){.sidebar{padding:12px}.sidebar h1{font-size:1.1rem}label{font-size:0.85rem}button,select,input{font-size:0.85rem;padding:7px}}
</style>
</head>
<body>
<div id="hamburger"><div></div><div></div><div></div></div>
<div class="sidebar hide" id="sidebar">
  <h1>Search Visualizer</h1>
  <div class="control-group">
    <label>Theme</label>
    <button id="themeToggle">Toggle Dark/Light</button>
  </div>
  <div class="control-group">
    <label>Algorithm</label>
    <select id="algorithmSelect">
      <option value="bfs">Breadth-First Search (BFS)</option>
      <option value="dfs">Depth-First Search (DFS)</option>
      <option value="dls">Depth-Limited Search (DLS)</option>
      <option value="iddfs">Iterative Deepening (IDDFS)</option>
      <option value="bi">Bidirectional Search</option>
      <option value="ucs">Uniform Cost Search (UCS)</option>
      <option value="greedy">Greedy Best-First Search</option>
      <option value="astar">A* Search</option>
    </select>
  </div>
  <div class="control-group hidden" id="depthLimitGroup">
    <label>Depth Limit</label>
    <input type="number" id="depthLimitInput" value="3" min="1" max="12">
  </div>
  <div class="control-group">
    <label>Speed: <span id="speedVal">Fast</span></label>
    <input type="range" id="speedRange" min="50" max="1000" step="50" value="200" style="direction:rtl">
  </div>
  <div class="control-group">
    <button id="runBtn">Run Search ▶</button>
    <button id="resetBtn" class="secondary">Reset Visualization</button>
    <button id="newTreeBtn" class="secondary">Generate New Tree 🎲</button>
  </div>
  <div class="control-group">
    <label>Tree Type</label>
    <select id="treeTypeSelect">
      <option value="random">Random Tree</option>
      <option value="balanced">Balanced Tree</option>
      <option value="weighted">Weighted Tree</option>
      <option value="grid">Grid Graph</option>
    </select>
  </div>
  <div class="stats" id="statusBox">Ready to run.<br>Nodes Visited: 0<br>Path Cost: 0</div>
  <div class="legend">
    <div class="legend-item"><div class="dot" style="background:var(--current-color)"></div>Current</div>
    <div class="legend-item"><div class="dot" style="background:var(--frontier-color)"></div>Frontier</div>
    <div class="legend-item"><div class="dot" style="background:var(--visited-color)"></div>Visited</div>
    <div class="legend-item"><div class="dot" style="background:var(--bi-color)"></div>Backward (Bi)</div>
    <div class="legend-item"><div class="dot" style="background:var(--path-color)"></div>Path</div>
    <div class="legend-item"><div class="dot" style="background:var(--goal-color)"></div>Goal</div>
  </div>
</div>
<div class="main-area" id="mainArea"><svg id="treeSvg"></svg></div>

<script>
// -------------------- Basic UI behavior --------------------
const hamburger = document.getElementById('hamburger');
const sidebar = document.getElementById('sidebar');
hamburger.addEventListener('click', ()=>{sidebar.classList.toggle('hide');hamburger.classList.toggle('active')});
const themeToggle = document.getElementById('themeToggle');
themeToggle.addEventListener('click', ()=>document.body.classList.toggle('light-theme'));

const speedRange = document.getElementById('speedRange');
const speedVal = document.getElementById('speedVal');
speedRange.addEventListener('input', e=>{const v=parseInt(e.target.value); let label='Normal'; if(v<300) label='Slow'; if(v>700) label='Fast'; if(v>900) label='Instant'; speedVal.textContent=label});

// -------------------- D3 setup --------------------
const width = window.innerWidth - 320; const height = window.innerHeight;
const svg = d3.select('#treeSvg').attr('width','100%').attr('height','100%');
const g = svg.append('g').attr('transform','translate(50,50)');
svg.call(d3.zoom().scaleExtent([0.2,3]).on('zoom', (e)=>g.attr('transform', e.transform)));

// -------------------- Tree generation (hierarchy) --------------------
let idCounter = 0; function resetId(){idCounter=0}
function createNode(currentDepth, maxDepth, branching){
  const id = idCounter++;
  const name = String.fromCharCode(65 + (id % 26)) + (Math.floor(id/26) > 0 ? Math.floor(id/26) : '');
  const node = { id, name, children: [], value: Math.floor(Math.random()*10)+1, depth: currentDepth };
  if(currentDepth < maxDepth){
    const numChildren = Math.floor(Math.random()*branching)+1;
    for(let i=0;i<numChildren;i++){ if(Math.random()>0.12) node.children.push(createNode(currentDepth+1, maxDepth, branching)); }
  }
  return node;
}

let treeData=null, rootNode=null, nodes=[], links=[], goalNodeId=null;
function generateTree(depth=5, branching=3, type='random'){
  resetId();
  if(type==='balanced'){
    // balanced binary-like tree
    function build(level){
      const n = { id: idCounter++, name: String.fromCharCode(65 + (idCounter % 26)) + (Math.floor(idCounter/26)>0?Math.floor(idCounter/26):''), children:[], value: Math.floor(Math.random()*10)+1, depth: level };
      if(level>0){ n.children.push(build(level-1)); n.children.push(build(level-1)); }
      return n;
    }
    treeData = build(depth);
  } else if(type==='grid'){
    // convert grid into tree-like structure: create nodes and connect in grid but use d3.hierarchy fallback
    // We'll create a shallow root with grid rows as children
    const root = { id:idCounter++, name:'Root', children:[] };
    for(let r=0;r<depth;r++){
      const row = { id:idCounter++, name:'R'+r, children:[], value: Math.floor(Math.random()*10)+1, depth:1 };
      for(let c=0;c<depth;c++) row.children.push({ id:idCounter++, name:`${r},${c}`, children:[], value:Math.floor(Math.random()*10)+1, depth:2 });
      root.children.push(row);
    }
    treeData = root;
  } else {
    treeData = createNode(0, depth, branching);
  }
  updateLayout(); pickGoal();
}

function updateLayout(){
  const treeLayout = d3.tree().size([Math.max(400, window.innerHeight-140), Math.max(600, window.innerWidth-380)]);
  rootNode = d3.hierarchy(treeData);
  treeLayout(rootNode);
  nodes = rootNode.descendants(); links = rootNode.links(); render();
}

function pickGoal(){ const leaves = nodes.filter(d=>!d.children); if(leaves.length===0) goalNodeId=0; else goalNodeId = leaves[Math.floor(Math.random()*leaves.length)].data.id; render(); }

// -------------------- Rendering --------------------
function render(){ g.selectAll('*').remove();
  // links
  g.selectAll('.link').data(links).enter().append('path').attr('class','link').attr('id', d=>`link-${d.target.data.id}`).attr('d', d3.linkHorizontal().x(d=>d.y).y(d=>d.x));
  // nodes
  const nodeGroup = g.selectAll('.node').data(nodes).enter().append('g').attr('class', d=>{let c='node'; if(d.data.id===0) c+=' start'; if(d.data.id===goalNodeId) c+=' goal'; return c}).attr('id', d=>`node-${d.data.id}`).attr('transform', d=>`translate(${d.y},${d.x})`);
  nodeGroup.append('circle').attr('r',18);
  nodeGroup.append('text').attr('dy',4).attr('text-anchor','middle').text(d=>d.data.name);
  nodeGroup.append('text').attr('class','cost').attr('dy',24).attr('text-anchor','middle').text(d=>d.data.value);
}

// -------------------- Algorithms (core features from original) --------------------
async function runSearch(){
  resetVisuals();
  const algo = document.getElementById('algorithmSelect').value;
  const startNode = nodes.find(n=>n.data.id===0);
  const goalNode = nodes.find(n=>n.data.id===goalNodeId);
  const depthLimit = parseInt(document.getElementById('depthLimitInput').value) || 3;
  if(!startNode || !goalNode) return;
  let path=[]; let visitedOrder=[];
  const getNeighbors = (node)=> node.children || [];

  if(algo==='bfs'){
    let queue=[startNode]; let visited=new Set([startNode.data.id]); let parentMap=new Map();
    while(queue.length>0){ let current=queue.shift(); visitedOrder.push({node:current,type:'normal'}); if(current.data.id===goalNode.data.id) break; for(let child of getNeighbors(current)){ if(!visited.has(child.data.id)){ visited.add(child.data.id); parentMap.set(child.data.id,current); queue.push(child); } } }
    path = reconstructPath(parentMap, goalNode);
  }
  else if(algo==='dfs'){
    let stack=[startNode]; let visited=new Set(); let parentMap=new Map();
    while(stack.length>0){ let current=stack.pop(); if(visited.has(current.data.id)) continue; visited.add(current.data.id); visitedOrder.push({node:current,type:'normal'}); if(current.data.id===goalNode.data.id) break; const children=getNeighbors(current); for(let i=children.length-1;i>=0;i--){ let child=children[i]; if(!visited.has(child.data.id)){ parentMap.set(child.data.id,current); stack.push(child); } } }
    path = reconstructPath(parentMap, goalNode);
  }
  else if(algo==='dls'){
    let stack=[{node:startNode,depth:0}]; let parentMap=new Map(); while(stack.length>0){ let {node:current,depth}=stack.pop(); visitedOrder.push({node:current,type:'normal'}); if(current.data.id===goalNode.data.id) break; if(depth<depthLimit){ const children=getNeighbors(current); for(let i=children.length-1;i>=0;i--){ let child=children[i]; parentMap.set(child.data.id,current); stack.push({node:child,depth:depth+1}); } } } if(visitedOrder.length>0 && visitedOrder[visitedOrder.length-1].node.data.id===goalNode.data.id) path=reconstructPath(parentMap,goalNode);
  }
  else if(algo==='iddfs'){
    for(let limit=0; limit<=10; limit++){ visitedOrder.push({type:'message',text:`Depth Limit: ${limit}`}); let stack=[{node:startNode,depth:0}]; let parentMap=new Map(); let found=false; while(stack.length>0){ let {node:current,depth}=stack.pop(); visitedOrder.push({node:current,type:'normal'}); if(current.data.id===goalNode.data.id){ found=true; path=reconstructPath(parentMap,goalNode); break;} if(depth<limit){ const children=getNeighbors(current); for(let i=children.length-1;i>=0;i--){ let child=children[i]; parentMap.set(child.data.id,current); stack.push({node:child,depth:depth+1}); } } } if(found) break; visitedOrder.push({type:'clear'}); }
  }
  else if(algo==='bi'){
    let qStart=[startNode]; let visitedStart=new Map(); visitedStart.set(startNode.data.id,null);
    let qGoal=[goalNode]; let visitedGoal=new Map(); visitedGoal.set(goalNode.data.id,null);
    let intersection=null;
    while(qStart.length>0 && qGoal.length>0){ if(qStart.length>0){ let currS=qStart.shift(); visitedOrder.push({node:currS,type:'normal'}); if(visitedGoal.has(currS.data.id)){ intersection=currS; break;} let neighbors=[...getNeighbors(currS)]; if(currS.parent) neighbors.push(currS.parent); for(let neighbor of neighbors){ if(!visitedStart.has(neighbor.data.id)){ visitedStart.set(neighbor.data.id,currS); qStart.push(neighbor); } } }
      if(qGoal.length>0){ let currG=qGoal.shift(); visitedOrder.push({node:currG,type:'bi-back'}); if(visitedStart.has(currG.data.id)){ intersection=currG; break;} let neighbors=[...getNeighbors(currG)]; if(currG.parent) neighbors.push(currG.parent); for(let neighbor of neighbors){ if(!visitedGoal.has(neighbor.data.id)){ visitedGoal.set(neighbor.data.id,currG); qGoal.push(neighbor); } } }
    }
    if(intersection){ let curr=intersection; while(curr){ path.unshift(curr); curr=visitedStart.get(curr.data.id); } curr=visitedGoal.get(intersection.data.id); while(curr){ path.push(curr); curr=visitedGoal.get(curr.data.id); } }
  }
  else if(algo==='ucs'){
    let pq=[{node:startNode,cost:0}]; let visited=new Set(); let parentMap=new Map(); let costMap=new Map(); costMap.set(startNode.data.id,0);
    while(pq.length>0){ pq.sort((a,b)=>a.cost-b.cost); let {node:current,cost}=pq.shift(); if(visited.has(current.data.id)) continue; visited.add(current.data.id); visitedOrder.push({node:current,type:'normal'}); if(current.data.id===goalNode.data.id) break; for(let child of getNeighbors(current)){ let newCost = cost + child.data.value; if(!visited.has(child.data.id)){ if(!costMap.has(child.data.id) || newCost < costMap.get(child.data.id)){ costMap.set(child.data.id,newCost); parentMap.set(child.data.id,current); pq.push({node:child,cost:newCost}); } } } }
    path = reconstructPath(parentMap,goalNode);
  }
  else if(algo==='greedy'){
    let pq=[{node:startNode,h:heuristic(startNode,goalNode)}]; let visited=new Set(); let parentMap=new Map();
    while(pq.length>0){ pq.sort((a,b)=>a.h-b.h); let {node:current}=pq.shift(); if(visited.has(current.data.id)) continue; visited.add(current.data.id); visitedOrder.push({node:current,type:'normal'}); if(current.data.id===goalNode.data.id) break; for(let child of getNeighbors(current)){ if(!visited.has(child.data.id)){ parentMap.set(child.data.id,current); pq.push({node:child,h:heuristic(child,goalNode)}); } } }
    path = reconstructPath(parentMap,goalNode);
  }
  else if(algo==='astar'){
    let pq=[{node:startNode,g:0,f:0}]; let visited=new Set(); let parentMap=new Map(); let gScore=new Map(); gScore.set(startNode.data.id,0);
    while(pq.length>0){ pq.sort((a,b)=>a.f-b.f); let {node:current}=pq.shift(); if(visited.has(current.data.id)) continue; visited.add(current.data.id); visitedOrder.push({node:current,type:'normal'}); if(current.data.id===goalNode.data.id) break; for(let child of getNeighbors(current)){ let tentativeG = gScore.get(current.data.id) + child.data.value; if(!gScore.has(child.data.id) || tentativeG < gScore.get(child.data.id)){ parentMap.set(child.data.id,current); gScore.set(child.data.id,tentativeG); let f = tentativeG + heuristic(child,goalNode); pq.push({node:child,g:tentativeG,f:f}); } } }
    path = reconstructPath(parentMap,goalNode);
  }

  await visualize(visitedOrder,path);
}

function heuristic(node,goal){ return Math.abs(node.depth - goal.depth)*10; }
function reconstructPath(parentMap,goal){ let path=[]; let curr = goal; while(curr){ path.unshift(curr); curr = parentMap.get(curr.data.id); } if(path.length>0 && path[0].data.id===0) return path; return []; }

// -------------------- Visualization loop --------------------
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
async function visualize(visitedOrder,path){
  const statusBox = document.getElementById('statusBox'); let visitedCount=0; document.getElementById('runBtn').disabled=true; document.getElementById('newTreeBtn').disabled=true;
  const animationSpeed = 1050 - parseInt(document.getElementById('speedRange').value || 200);
  for(let item of visitedOrder){ if(item.type==='clear'){ d3.selectAll('.node').classed('visited',false).classed('current',false); d3.selectAll('.link').classed('searched',false); await sleep(animationSpeed*1.5); continue; } if(item.type==='message'){ statusBox.innerHTML = `${item.text}<br>Nodes Visited: ${visitedCount}`; await sleep(animationSpeed); continue; } const node = item.node; visitedCount++; const nodeEl = d3.select(`#node-${node.data.id}`); nodeEl.classed('current',true); if(item.type==='bi-back') nodeEl.classed('visited-bi',true); statusBox.innerHTML = `Running...<br>Nodes Visited: ${visitedCount}`; await sleep(animationSpeed); nodeEl.classed('current',false); if(item.type!=='bi-back') nodeEl.classed('visited',true); if(node.parent && item.type!=='bi-back'){ d3.select(`#link-${node.data.id}`).classed('searched',true); } }

  if(path.length>0){ statusBox.innerHTML += `<br><strong>Goal Found!</strong> Path length: ${path.length}`; for(let node of path){ d3.select(`#node-${node.data.id}`).classed('path',true); if(node.parent){ const link = d3.select(`#link-${node.data.id}`); if(!link.empty()) link.classed('path',true); } await sleep(animationSpeed/2); } } else { statusBox.innerHTML += `<br><strong>Goal Not Found.</strong>`; }
  document.getElementById('runBtn').disabled=false; document.getElementById('newTreeBtn').disabled=false;
}

function resetVisuals(){ d3.selectAll('.node').classed('visited',false).classed('current',false).classed('path',false).classed('frontier',false).classed('visited-bi',false); d3.selectAll('.link').classed('searched',false).classed('path',false); document.getElementById('statusBox').innerHTML='Ready to run.<br>Nodes Visited: 0'; }

// -------------------- Events --------------------
document.getElementById('runBtn').onclick = runSearch; document.getElementById('resetBtn').onclick = resetVisuals; document.getElementById('newTreeBtn').onclick = ()=>{ resetVisuals(); generateTree(5,3, document.getElementById('treeTypeSelect').value); };
document.getElementById('speedRange').oninput = (e)=>{ /* handled above */ };
document.getElementById('algorithmSelect').onchange = (e)=>{ const val = e.target.value; const depthGroup = document.getElementById('depthLimitGroup'); if(val==='dls') depthGroup.classList.remove('hidden'); else depthGroup.classList.add('hidden'); };

// -------------------- Init --------------------
generateTree(5,3,'random');
window.addEventListener('resize', ()=>{ updateLayout(); });

</script>
</body>
</html>
